version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "django-stubs*"]
    ignore:
      # Stay on the Django 5.2 LTS line (ADR 0002); moving to the next LTS is a planned change.
      - dependency-name: "django"
        versions: [">=5.3"]
      - dependency-name: "django-stubs"
        versions: [">=5.3"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Python version is chosen on purpose (CLAUDE.md); only patch updates come automatically.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
