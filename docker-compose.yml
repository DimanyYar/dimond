# Local development: database, mail catcher and the app with auto-reload.
# Production is docker-compose.prod.yml (ADR 0022).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    build: .
    env_file: .env
    environment:
      # Inside Docker the services are reached by name, not localhost.
      POSTGRES_HOST: db
      EMAIL_HOST: mailpit
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver --nostatic 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Sends queued emails (ADR 0004). Restarts if it starts before `web` has run migrations.
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      EMAIL_HOST: mailpit
    command: python manage.py send_emails --every 5
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Makes the small pictures on file tiles (ADR 0013). Apart from the site, so a broken or
  # hostile image or PDF is only ever decoded here.
  previews:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py make_previews --every 5
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Brings Jira task statuses back to requests every 15 minutes (ADR 0019). Its log is the
  # sync log in the admin; `docker compose logs -f sync` shows one line per run.
  sync:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py sync_tracker --every 900
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
