{% comment %}Files of a request or a reply, as tiles that open them. Needs `files`; `small` for a reply.{% endcomment %}
<ul class="tiles{% if small %} tiles-small{% endif %}" aria-label="Attached files">
  {% for file in files %}
    <li>{% include "files/file_tile.html" %}</li>
  {% endfor %}
</ul>
