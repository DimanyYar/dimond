{% comment %}Files attached to a request, as chips that open them. Needs `files`. Images and PDFs open in a new
tab; text files download.{% endcomment %}
<ul class="file-chips" aria-label="Attached files">
  {% for file in files %}
    <li>
      <a class="file-chip" href="{{ file.get_absolute_url }}"{% if file.shown_in_browser %} target="_blank" rel="noopener"{% else %} download{% endif %}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg>
        <span class="file-chip-name">{{ file.name }}</span>
        <span class="muted">{{ file.size|filesizeformat }}</span>
      </a>
    </li>
  {% endfor %}
</ul>
