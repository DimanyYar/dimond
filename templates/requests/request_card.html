{% comment %}One request on the board or in the list. Becomes a link when the request page lands.{% endcomment %}
<article class="request-card{% if item.status == 'needs_input' %} needs-you{% endif %}">
  <div class="request-card-meta">
    <span>{{ item.get_type_display }} · {{ item.key }}</span>
    <span class="status status-{{ item.status }}">{{ item.get_status_display }}</span>
  </div>
  <h3>{{ item.title }}</h3>
  <div class="request-card-meta">
    <span{% if item.when_needed == 'hotfix' %} class="hotfix"{% endif %}>Asked for: {{ item.get_when_needed_display }}</span>
    <time datetime="{{ item.created_at|date:'c' }}">{{ item.created_at|date:"M j" }}</time>
  </div>
</article>
